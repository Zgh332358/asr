services:
  asr-api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TEMP_DIR: /tmp/whisper_api
      STORAGE_PATH: /data/asr_storage
    volumes:
      - asr-storage:/data/asr_storage
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "3"
volumes:
  asr-storage:
